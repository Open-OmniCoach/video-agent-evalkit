# Benchmark registry. Paths are relative to `data_root` (set in the run config;
# defaults to the registry file's directory). Canonical prepared data uses
# `annotation: annotations/<bench>.json` and `video_dir: benchmarks/<Bench>`.
# Optional fields such as `source_path` are data-prep provenance, not runtime
# label sources. See docs/data.md.
sample_mcq:
  annotation: sample_mcq.jsonl
  video_dir: .
  status: ready
  report:
    breakdowns:
      - name: topic
        key: facets.topic
      - name: difficulty
        key: facets.difficulty

omnivideobench:
  annotation: annotations/omnivideobench.json
  video_dir: benchmarks/OmniVideoBench
  status: ready
  source_format: parquet
  source_path: benchmarks/OmniVideoBench/data.parquet
  scoring_protocol: official_mc_accuracy
  report:
    breakdowns:
      - name: task
        key: facets.task
      - name: audio_type
        key: facets.audio_type
      - name: video_type
        key: facets.video_type

omnivideo_test_full:
  annotation: annotations/omnivideo_test_full.json
  video_dir: benchmarks/OmniVideo-Test
  status: ready
  source_format: jsonl
  source_path: benchmarks/OmniVideo-Test/test_505.jsonl
  scoring_protocol: full_mc_accuracy
  report:
    breakdowns:
      - name: task
        key: facets.task
      - name: subtask
        key: facets.subtask
  source_counts:
    questions: 505
    source_videos: 264

