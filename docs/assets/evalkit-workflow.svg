<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">evalkit workflow</title>
  <desc id="desc">Benchmark data is prepared once with evalkit data link, convert and validate into a registry and normalized annotations. A model service is either started with evalkit serve, which writes a service manifest, or provided as an existing OpenAI-compatible endpoint. evalkit run loads cases, keeps a bounded window of them active, calls the generate function, which sends chat requests to the service, scores each generation, and writes predictions, trajectories and summaries under out_dir.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55606e"/>
    </marker>
    <marker id="arrow-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <style>
      .h { font: 700 15px 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; }
      .hm { font: 700 14px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #1f2933; }
      .t { font: 700 13px 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; }
      .m { font: 700 12.5px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #1f2933; }
      .ms { font: 400 11.5px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #3e4c59; }
      .s { font: 400 11.5px 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #52606d; }
      .si { font: italic 400 11.5px 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #52606d; }
      .p { font: 400 10.5px 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #7b8794; }
      .n { font: 700 12px 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .flow { stroke: #55606e; stroke-width: 1.6; fill: none; }
      .http { stroke: #b7791f; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .data { fill: #eef4ff; stroke: #6f8fd0; stroke-width: 1.2; }
      .data-out { fill: #dbe7ff; stroke: #3d63b5; stroke-width: 1.6; }
      .svc { fill: #fff6e6; stroke: #d29a45; stroke-width: 1.2; }
      .svc-out { fill: #ffe9c2; stroke: #b7791f; stroke-width: 1.6; }
      .run { fill: #f3faf5; stroke: #3e8e5e; stroke-width: 1.6; }
      .step { fill: #ffffff; stroke: #8cc5a0; stroke-width: 1.2; }
      .out { fill: #f5f0fc; stroke: #8a6cc2; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- 1. Prepare benchmark data -->
  <circle cx="32" cy="31" r="11" fill="#3d63b5"/>
  <text class="n" x="32" y="35.5">1</text>
  <text class="h" x="50" y="36">Prepare benchmark data (once)</text>

  <rect class="data" x="20" y="52" width="340" height="50" rx="8"/>
  <text class="t" x="32" y="72">Benchmark files and media</text>
  <text class="s" x="32" y="90">obtained from each benchmark's own release</text>

  <rect class="data" x="20" y="118" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="138">evalkit data link</text>
  <text class="s" x="32" y="156">symlink media into data/ from a manifest</text>

  <rect class="data" x="20" y="184" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="204">evalkit data convert</text>
  <text class="s" x="32" y="222">converters write annotations and registry entries</text>

  <rect class="data" x="20" y="250" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="270">evalkit data validate</text>
  <text class="s" x="32" y="288">check annotation paths and sample media</text>

  <rect class="data-out" x="20" y="316" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="336">configs/registry.yaml</text>
  <text class="ms" x="32" y="354">data/annotations/&lt;benchmark&gt;.json</text>

  <line class="flow" x1="190" y1="103" x2="190" y2="117" marker-end="url(#arrow)"/>
  <line class="flow" x1="190" y1="169" x2="190" y2="183" marker-end="url(#arrow)"/>
  <line class="flow" x1="190" y1="235" x2="190" y2="249" marker-end="url(#arrow)"/>
  <line class="flow" x1="190" y1="301" x2="190" y2="315" marker-end="url(#arrow)"/>

  <!-- 2. Model service -->
  <circle cx="32" cy="405" r="11" fill="#b7791f"/>
  <text class="n" x="32" y="409.5">2</text>
  <text class="h" x="50" y="410">Model service (optional local serving)</text>

  <rect class="svc" x="20" y="424" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="444">evalkit env sync &lt;backend&gt;</text>
  <text class="s" x="32" y="462">vllm, vllm-omni or sglang under ~/.venv/evalkit/</text>

  <rect class="svc" x="20" y="490" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="510">evalkit serve --config serve.yaml</text>
  <text class="s" x="32" y="528">start replicas and wait for their health checks</text>

  <rect class="svc-out" x="20" y="556" width="340" height="50" rx="8"/>
  <text class="m" x="32" y="576">runs/services/&lt;name&gt;.json</text>
  <text class="s" x="32" y="594">service manifest with replica URLs</text>

  <line class="flow" x1="190" y1="475" x2="190" y2="489" marker-end="url(#arrow)"/>
  <line class="flow" x1="190" y1="541" x2="190" y2="555" marker-end="url(#arrow)"/>

  <text class="si" x="20" y="630">Or set endpoint.base_url / base_urls in run.yaml</text>
  <text class="si" x="20" y="646">to use an existing OpenAI-compatible service.</text>

  <!-- 3. evalkit run -->
  <rect class="run" x="420" y="20" width="420" height="526" rx="12"/>
  <circle cx="440" cy="44" r="11" fill="#3e8e5e"/>
  <text class="n" x="440" y="48.5">3</text>
  <text class="hm" x="458" y="49">evalkit run --config run.yaml</text>

  <rect class="step" x="440" y="70" width="380" height="64" rx="8"/>
  <text class="t" x="452" y="90">Load cases</text>
  <text class="s" x="452" y="107">registry entry + annotation rows &#8594; EvalCase</text>
  <text class="p" x="452" y="123">evalkit/runtime/datasource.py</text>

  <rect class="step" x="440" y="168" width="380" height="64" rx="8"/>
  <text class="t" x="452" y="188">Keep a bounded window of cases active</text>
  <text class="s" x="452" y="205">&#8804; max_active_cases at a time; recorded UIDs skipped</text>
  <text class="p" x="452" y="221">evalkit/runtime/driver.py</text>

  <rect class="step" x="440" y="266" width="380" height="64" rx="8"/>
  <text class="m" x="452" y="286">generate(runtime, case, sampling)</text>
  <text class="s" x="452" y="303">built-in chat call, or your integration's agent loop</text>
  <text class="p" x="452" y="319">evalkit/generate/ &#183; examples/&lt;name&gt;/generate.py</text>

  <rect class="step" x="440" y="364" width="380" height="64" rx="8"/>
  <text class="m" x="452" y="384">score(runtime, case, generation)</text>
  <text class="s" x="452" y="401">rule scorer, or an LLM judge from aux_models</text>
  <text class="p" x="452" y="417">evalkit/runtime/scoring.py &#183; evalkit/bench/scoring.py</text>

  <rect class="step" x="440" y="462" width="380" height="64" rx="8"/>
  <text class="t" x="452" y="482">Record and aggregate</text>
  <text class="s" x="452" y="499">append each prediction; compute benchmark metrics</text>
  <text class="p" x="452" y="515">evalkit/bench/resume.py &#183; evalkit/bench/aggregate.py</text>

  <line class="flow" x1="630" y1="135" x2="630" y2="167" marker-end="url(#arrow)"/>
  <text class="p" x="640" y="155">EvalCase</text>
  <line class="flow" x1="630" y1="233" x2="630" y2="265" marker-end="url(#arrow)"/>
  <text class="p" x="640" y="253">pending case</text>
  <line class="flow" x1="630" y1="331" x2="630" y2="363" marker-end="url(#arrow)"/>
  <text class="p" x="640" y="351">GenerationResult</text>
  <line class="flow" x1="630" y1="429" x2="630" y2="461" marker-end="url(#arrow)"/>
  <text class="p" x="640" y="449">ScoreResult</text>

  <!-- Inputs into the run -->
  <path class="flow" d="M361,341 H392 V102 H438" marker-end="url(#arrow)"/>
  <path class="http" d="M362,581 H406 V298 H438" marker-start="url(#arrow-http)" marker-end="url(#arrow-http)"/>
  <text class="s" x="399" y="440" text-anchor="middle" transform="rotate(-90 399 440)">runtime.chat() requests (HTTP)</text>

  <!-- 4. Results -->
  <circle cx="892" cy="31" r="11" fill="#7a5bb5"/>
  <text class="n" x="892" y="35.5">4</text>
  <text class="h" x="910" y="36">Results under out_dir/</text>

  <rect class="out" x="880" y="52" width="300" height="56" rx="8"/>
  <text class="m" x="892" y="74">&lt;bench&gt;/predictions.jsonl</text>
  <text class="s" x="892" y="93">one JSON row per case; resume checkpoint</text>

  <rect class="out" x="880" y="120" width="300" height="56" rx="8"/>
  <text class="m" x="892" y="142">&lt;bench&gt;/artifacts/trajectories/</text>
  <text class="s" x="892" y="161">events returned by the generator</text>

  <rect class="out" x="880" y="188" width="300" height="56" rx="8"/>
  <text class="m" x="892" y="210">&lt;bench&gt;/summary.json</text>
  <text class="s" x="892" y="229">counts, metrics and report breakdowns</text>

  <rect class="out" x="880" y="256" width="300" height="56" rx="8"/>
  <text class="m" x="892" y="278">summary.json</text>
  <text class="s" x="892" y="297">all benchmarks and runtime metrics</text>

  <path class="flow" d="M821,494 H856 V80"/>
  <line class="flow" x1="856" y1="80" x2="878" y2="80" marker-end="url(#arrow)"/>
  <line class="flow" x1="856" y1="148" x2="878" y2="148" marker-end="url(#arrow)"/>
  <line class="flow" x1="856" y1="216" x2="878" y2="216" marker-end="url(#arrow)"/>
  <line class="flow" x1="856" y1="284" x2="878" y2="284" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line class="flow" x1="884" y1="356" x2="916" y2="356" marker-end="url(#arrow)"/>
  <text class="s" x="926" y="360">data and control flow</text>
  <line class="http" x1="884" y1="380" x2="916" y2="380" marker-end="url(#arrow-http)"/>
  <text class="s" x="926" y="384">OpenAI-compatible chat requests</text>
</svg>
