registry_path: ../../../../configs/registry.yaml
data_root: ../../../../data
out_dir: ../../../../runs/qwen3-omni-instruct-timelens

scheduler:
  max_active_cases: 64

model:
  generate_fn: examples.qwen3_omni_instruct.generate:generate
  endpoint:
    service_manifest: ../../../../runs/services/qwen3-omni-instruct.json
    service_model: candidate
    api_key: EMPTY
    media_transport: file_uri
    timeout: 1200
    max_inflight: 64
    request_retries: 3
    extra_body:
      media_io_kwargs:
        video: {fps: 1, max_frames: 256}
      mm_processor_kwargs:
        fps: 1
        max_frames: 256
        min_pixels: 131072
        max_pixels: 147456
        use_audio_in_video: true

defaults:
  sampling: {temperature: 0, max_tokens: 8192}
  prompt: {audio: on}
  budget: {}
  scoring: {type: rule}
  idempotent: true

retry:
  case_max_attempts: 2

flush_every: 20

eval_datasets:
  - name: timelens_bench
