manifest_path: ../../../../runs/services/qwen2_5_omni_agent.json
working_dir: ../../../..
host: 127.0.0.1
advertise_host: 127.0.0.1
startup_timeout: 1800
terminate_timeout: 30
models:
  candidate:
    backend: vllm
    model: /path/to/qwen2.5-omni-agent-checkpoint
    served_model_name: qwen2.5-omni-agent
    adapter: vllm_multimodal
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      VLLM_MAX_AUDIO_DECODE_DURATION_S: '3600'
    args:
      - --tensor-parallel-size
      - '1'
      - --dtype
      - bfloat16
      - --max-model-len
      - '131072'
      - --hf-overrides
      - >-
        {"thinker_config":{"text_config":{
          "max_position_embeddings":131072,
          "rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}
        }}}
      - --gpu-memory-utilization
      - '0.85'
      - --max-num-seqs
      - '2'
      - --max-num-batched-tokens
      - '131072'
      - --enforce-eager
      - --skip-mm-profiling
      - --limit-mm-per-prompt
      - '{"image":256,"audio":1,"video":0}'
      - --mm-processor-kwargs
      - '{"audio_kwargs":{"truncation":false}}'
      - --chat-template
      - examples/omni_agent/templates/qwen2_5_omni.jinja
      - --chat-template-content-format
      - openai
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --allowed-local-media-path
      - ${OMNI_AGENT_MEDIA_CACHE_ROOT}
      - --mm-processor-cache-gb
      - '0'
    replicas:
      - gpus: [0]
        port: 8000
