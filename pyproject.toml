[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "Video Agent EvalKit (VAE): video agent and multimodal benchmark evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
convert = [
    "pandas>=2.2",
    "pyarrow>=17",
]
test = [
    "pytest>=8.3",
]

[dependency-groups]
media = [
    # Decord publishes only these wheels and no source distribution.
    "decord==0.6.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "pillow>=10.4",
    "static-ffmpeg==3.0",
]

[tool.uv]
required-version = "==0.11.28"
default-groups = ["media"]

[project.urls]
Homepage = "https://github.com/Kagura-0001/video-agent-evalkit"

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evalkit", "evalkit.*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
